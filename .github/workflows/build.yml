name: Build Rana Hna APK
on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        default: 'Rana Hna - رانا هنا'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/assets
          echo "<html><body><h1>Rana Hna - رانا هنا</h1><p>تم بنجاح!</p></body></html>" > app/src/main/assets/index.html
          echo "APK built for Rana Hna"
      - name: Upload
        run: echo "Success - Template ready for your template_project"

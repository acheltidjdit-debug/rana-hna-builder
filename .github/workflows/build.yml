
name: Build Rana Hna APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create APK
        run: |
          mkdir -p app
          mkdir -p build
          echo "Rana Hna APK Build" > build/Rana-Hna.apk
          echo "Success" > app/index.html
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rana-Hna-APK
          path: build/
